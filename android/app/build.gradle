plugins { id 'com.android.application' }
android {
 namespace 'local.neonstrip.studio'
 compileSdk 35
 defaultConfig { applicationId 'local.neonstrip.studio'; minSdk 26; targetSdk 35; versionCode 2; versionName '1.0.1' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets { main.assets.srcDirs = [layout.buildDirectory.dir('generated/neonAssets')] }
}
tasks.register('syncWeb', Sync) { from('../../web'); into(layout.buildDirectory.dir('generated/neonAssets')) }
tasks.named('preBuild').configure { dependsOn('syncWeb') }
